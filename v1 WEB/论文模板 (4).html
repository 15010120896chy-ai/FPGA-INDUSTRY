<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>缺陷统计直方图 & 饼图 & AI 结论</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>    :root{        --bg:#111827;        --card:#1e293b;        --accent:#38bdf8;        --text:#f1f5f9;        --error:#f87171;        --success:#34d399;    }    *{margin:0;padding:0;box-sizing:border-box}    body{        background:var(--bg);        color:var(--text);        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;        height:100vh;        display:flex;        align-items:center;        justify-content:center;        padding:20px;    }    .card{        background:var(--card);        border-radius:12px;        padding:20px;        max-width:720px;        width:100%;        box-shadow:0 8px 32px rgba(0,0,0,.4);    }    .chart-row{        display:flex;        gap:20px;        margin-bottom:20px;    }    .chart-box{        flex:1;        height:260px;        position:relative;    }    h1{        font-size:1.35rem;        margin-bottom:15px;        text-align:center;    }    button{        background:var(--accent);        color:#000;        border:none;        padding:10px 24px;        border-radius:6px;        font-weight:600;        cursor:pointer;    }    button:disabled{opacity:.5;cursor:not-allowed}    #result{        margin-top:15px;        padding:12px;        border-radius:8px;        background:#0f172a;        min-height:60px;        white-space:pre-wrap;        word-break:break-word;        font-size:.9rem;        text-align:center;    }    .loading{color:var(--accent)}    .error  {color:var(--error)}    .success{color:var(--success)}</style></head><body><div class="card">    <h1>缺陷统计直方图 & 饼图</h1>    <div class="chart-row">        <!-- 左侧直方图 -->        <div class="chart-box">            <canvas id="barChart"></canvas>        </div>        <!-- 右侧饼图 -->        <div class="chart-box">            <canvas id="pieChart"></canvas>        </div>    </div>    <div style="text-align:center">        <button id="startBtn" onclick="startAnalysis()">获取 AI 结论</button>        <div id="result" class="success">点击按钮即可把数据发送给本地 LM Studio 并查看分析结论</div>    </div></div><script>/* ========== 数据 ========== */const data = {擦伤:331,裂边:135,脏污:1014,褶皱:1143,针孔:138};const labels = Object.keys(data);const values = Object.values(data);/* ========== 左侧直方图 ========== */new Chart(document.getElementById('barChart'),{    type:'bar',    data:{        labels,        datasets:[{            label:'缺陷数量',            data:values,            backgroundColor:'#38bdf8',            borderRadius:4        }]    },    options:{        responsive:true,        maintainAspectRatio:false,        plugins:{legend:{display:false}},        scales:{            y:{beginAtZero:true,ticks:{color:'#f1f5f9'}},            x:{ticks:{color:'#f1f5f9'}}        }    }});/* ========== 右侧饼图 ========== */new Chart(document.getElementById('pieChart'),{    type:'pie',    data:{        labels,        datasets:[{data:values,backgroundColor:['#38bdf8','#34d399','#f87171','#fbbf24','#a78bfa']}]    },    options:{        responsive:true,        maintainAspectRatio:false,        plugins:{            legend:{position:'bottom',labels:{color:'#f1f5f9',padding:15,font:{size:14}}},            tooltip:{titleFont:{size:15},bodyFont:{size:13}}        }    }});/* ========== AI 调用 ========== */async function startAnalysis(){    const btn=document.getElementById('startBtn');    const res=document.getElementById('result');    btn.disabled=true;    res.className='loading';    res.textContent='正在分析…';    try{        const prompt=`请根据以下缺陷数据给出简短洞察（150字内）：\n${JSON.stringify(data)}`;        const resp=await fetch('http://127.0.0.1:1234/v1/chat/completions',{            method:'POST',            headers:{'Content-Type':'application/json'},            body:JSON.stringify({model:'local-model',messages:[{role:'user',content:prompt}],max_tokens:150,temperature:.2})        });        if(!resp.ok) throw new Error('LM Studio 返回 '+resp.status);        const result=await resp.json();        res.className='success';        res.textContent=result.choices?.[0]?.message?.content||'无返回内容';    }catch(err){        res.className='error';        res.textContent='❌ '+err.message;    }finally{        btn.disabled=false;    }}</script></body></html>
