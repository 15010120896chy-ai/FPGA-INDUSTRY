<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>缺陷数据饼图 & AI 洞察</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>    :root{        --bg:#111827;        --card:#1e293b;        --accent:#38bdf8;        --text:#f1f5f9;        --error:#f87171;        --success:#34d399;    }    *{margin:0;padding:0;box-sizing:border-box}    body{        background:var(--bg);        color:var(--text);        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;        display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;    }    .card{        background:var(--card);        border-radius:12px;        padding:30px 25px;        max-width:560px;        width:100%;        text-align:center;        box-shadow:0 8px 32px rgba(0,0,0,.4);    }    h1{margin-bottom:18px;font-size:1.6rem}    #pieBox{position:relative;height:280px;width:280px;margin:10px auto 20px}    button{        background:var(--accent);        color:#000;        border:none;        padding:12px 26px;        border-radius:6px;        font-weight:600;        cursor:pointer;        transition:.2s;    }    button:disabled{opacity:.5;cursor:not-allowed}    button:hover:not(:disabled){filter:brightness(1.1)}    #result{        margin-top:24px;        padding:16px;        border-radius:8px;        background:#0f172a;        min-height:60px;        white-space:pre-wrap;        word-break:break-word;        font-size:.95rem;    }    .loading{color:var(--accent)}    .error{color:var(--error)}    .success{color:var(--success)}</style></head><body>    <div class="card">        <h1>缺陷统计 & AI 结论</h1>        <div id="pieBox"><canvas id="pieChart"></canvas></div>        <button id="startBtn" onclick="startAnalysis()">开始分析</button>        <div id="result" class="success">点击下方按钮查看 AI 结论</div>    </div><script>/* 数据 */const rawData = {擦伤:331,裂边:135,脏污:1014,褶皱:1143,针孔:138};const labels = Object.keys(rawData);const values = Object.values(rawData);const total = values.reduce((a,b)=>a+b,0);/* 饼图：文字放大 */const ctx = document.getElementById('pieChart');new Chart(ctx,{    type:'pie',    data:{        labels,        datasets:[{data:values,backgroundColor:['#38bdf8','#34d399','#f87171','#fbbf24','#a78bfa']}]    },    options:{        responsive:true,        maintainAspectRatio:false,        plugins:{            legend:{position:'bottom',labels:{color:'#f1f5f9',padding:15,font:{size:15}}},            tooltip:{                titleFont:{size:16},                bodyFont:{size:14},                callbacks:{                    label:ctx=>{                        const v = ctx.raw;                        const p = ((v/total)*100).toFixed(1);                        return `${ctx.label}: ${v} (${p}%)`;                    }                }            }        }    }});/* AI 调用 */async function startAnalysis(){    const btn=document.getElementById('startBtn');    const res=document.getElementById('result');    btn.disabled=true;    res.className='loading';    res.textContent='正在生成 AI 结论…';    try{        const prompt=`请根据以下缺陷数据给出简短洞察（150字内）：\n${JSON.stringify(rawData)}`;        const resp=await fetch('http://127.0.0.1:1234/v1/chat/completions',{            method:'POST',            headers:{'Content-Type':'application/json'},            body:JSON.stringify({model:'local-model',messages:[{role:'user',content:prompt}],max_tokens:150,temperature:.2})        });        if(!resp.ok) throw new Error('LM Studio 返回 '+resp.status);        const data=await resp.json();        res.className='success';        res.textContent=data.choices?.[0]?.message?.content||'无返回内容';    }catch(err){        res.className='error';        res.textContent='❌ '+err.message;    }finally{        btn.disabled=false;    }}</script></body></html>
