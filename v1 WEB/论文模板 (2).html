<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>数据饼图 + AI 分析</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>    :root{        --bg:#111827;        --card:#1e293b;        --accent:#38bdf8;        --text:#f1f5f9;        --error:#f87171;        --success:#34d399;    }    *{margin:0;padding:0;box-sizing:border-box}    body{        background:var(--bg);        color:var(--text);        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;        display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;    }    .card{        background:var(--card);        border-radius:12px;        padding:30px 25px;        max-width:560px;        width:100%;        text-align:center;        box-shadow:0 8px 32px rgba(0,0,0,.4);    }    h1{margin-bottom:18px;font-size:1.6rem}    #pieBox{position:relative;height:260px;width:260px;margin:10px auto 20px}    button{        background:var(--accent);        color:#000;        border:none;        padding:12px 26px;        border-radius:6px;        font-weight:600;        cursor:pointer;        transition:.2s;    }    button:disabled{opacity:.5;cursor:not-allowed}    button:hover:not(:disabled){filter:brightness(1.1)}    #result{        margin-top:24px;        padding:16px;        border-radius:8px;        background:#0f172a;        min-height:60px;        white-space:pre-wrap;        word-break:break-word;        font-size:.95rem;    }    .loading{color:var(--accent)}    .error{color:var(--error)}    .success{color:var(--success)}</style></head><body>    <div class="card">        <h1>数据饼图 & AI 洞察</h1>        <!-- 饼图容器 -->        <div id="pieBox">            <canvas id="pieChart"></canvas>        </div>        <button id="startBtn" onclick="startAnalysis()">开始分析</button>        <div id="result" class="success">点击按钮即可查看饼图并获取 AI 结论</div>    </div><script>/* ========== 1. 静态数据 ========== */const rawData = {    "ca_shang": 331,    "liebian": 135,    "zang_wu": 1014,    "zhe_zhou": 1143,    "zhen_kong": 138};/* ========== 2. 绘制饼图 ========== */const labels = Object.keys(rawData);const values = Object.values(rawData);const total = values.reduce((a,b)=>a+b,0);const ctx = document.getElementById('pieChart');const pieChart = new Chart(ctx, {    type:'pie',    data:{        labels:labels,        datasets:[{            data:values,            backgroundColor:['#38bdf8','#34d399','#f87171','#fbbf24','#a78bfa']        }]    },    options:{        responsive:true,        maintainAspectRatio:false,        plugins:{            legend:{position:'bottom',labels:{color:'#f1f5f9',padding:15}},            tooltip:{                callbacks:{                    label:(ctx)=>{                        const v = ctx.raw;                        const p = ((v/total)*100).toFixed(1);                        return `${ctx.label}: ${v} (${p}%)`;                    }                }            }        }    }});/* ========== 3. 与 LM Studio 交互 ========== */async function startAnalysis(){    const btn=document.getElementById('startBtn');    const res=document.getElementById('result');    btn.disabled=true;    res.className='loading';    res.textContent='正在生成 AI 结论…';    try{        const prompt=`请根据以下数据给出简短洞察（控制在150字内）：\n${JSON.stringify(rawData)}`;        const lmResp=await fetch('http://127.0.0.1:1234/v1/chat/completions',{            method:'POST',            headers:{'Content-Type':'application/json'},            body:JSON.stringify({                model:'local-model',                messages:[{role:'user',content:prompt}],                max_tokens:150,                temperature:.2            })        });        if(!lmResp.ok) throw new Error('LM Studio 返回 '+lmResp.status);        const data=await lmResp.json();        const reply=data.choices?.[0]?.message?.content||'无返回内容';        res.className='success';        res.textContent=reply;    }catch(err){        res.className='error';        res.textContent='❌ '+err.message;    }finally{        btn.disabled=false;    }}</script></body></html>
